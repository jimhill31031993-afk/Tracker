<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Control — Project Timeline Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <span class="topbar-mark">SC</span>
    <div>
      <h1>Site Control</h1>
      <p class="topbar-sub">Project timeline tracker</p>
    </div>
  </div>
  <button id="btnAddNew" class="btn btn-primary">+ Add new</button>
</header>

<main>
  <div class="table-wrap">
    <table id="trackerTable">
      <thead>
        <tr>
          <th class="col-no">No</th>
          <th class="col-address">Address</th>
          <th class="col-wbs">WBS</th>
          <th class="col-stage">Stage</th>
          <th class="col-date">Start date</th>
          <th class="col-alloc">Allocated</th>
          <th class="col-remain">Remaining</th>
          <th class="col-actions">Start / Hold</th>
          <th class="col-status">Current status</th>
          <th class="col-comment">Last status comment</th>
          <th class="col-row-actions"></th>
        </tr>
      </thead>
      <tbody id="rowsBody">
      </tbody>
    </table>
    <p id="emptyState" class="empty-state">No projects yet. Click <strong>+ Add new</strong> to log your first one.</p>
  </div>
</main>

<!-- ===================== ADD NEW MODAL ===================== -->
<div id="modalAdd" class="modal-backdrop">
  <div class="modal">
    <div class="modal-head">
      <h2>Add new project</h2>
      <button class="modal-close" data-close="modalAdd">&times;</button>
    </div>
    <form id="formAdd">
      <label>Address
        <input type="text" id="fAddress" required placeholder="e.g. 12 Queen Street, Auckland">
      </label>
      <label>WBS
        <input type="text" id="fWbs" required placeholder="e.g. WBS-014">
      </label>
      <label>Stage
        <select id="fStage" required>
          <option value="Not Selected">Not Selected</option>
          <option value="Indicative">Indicative — 5 weekdays</option>
          <option value="Detail Design">Detail Design — 20 weekdays</option>
          <option value="Pricing">Pricing — 2 weekdays</option>
          <option value="Handover">Handover — 3 weekdays</option>
          <option value="Redesign">Redesign — 5 weekdays</option>
          <option value="Repricing">Repricing — 2 weekdays</option>
          <option value="ECI">ECI — 10 weekdays</option>
          <option value="Tender">Tender — 10 weekdays</option>
          <option value="Submitted">Submitted</option>
        </select>
      </label>
      <label>Start date
        <input type="date" id="fStartDate" required>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close="modalAdd">Cancel</button>
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>
    </form>
  </div>
</div>

<!-- ===================== EDIT MODAL ===================== -->
<div id="modalEdit" class="modal-backdrop">
  <div class="modal">
    <div class="modal-head">
      <h2>Edit project</h2>
      <button class="modal-close" data-close="modalEdit">&times;</button>
    </div>
    <form id="formEdit">
      <input type="hidden" id="eId">
      <label>Address
        <input type="text" id="eAddress" required>
      </label>
      <label>WBS
        <input type="text" id="eWbs" required>
      </label>
      <label>Stage
        <select id="eStage" required>
          <option value="Not Selected">Not Selected</option>
          <option value="Indicative">Indicative — 5 weekdays</option>
          <option value="Detail Design">Detail Design — 20 weekdays</option>
          <option value="Pricing">Pricing — 2 weekdays</option>
          <option value="Handover">Handover — 3 weekdays</option>
          <option value="Redesign">Redesign — 5 weekdays</option>
          <option value="Repricing">Repricing — 2 weekdays</option>
          <option value="ECI">ECI — 10 weekdays</option>
          <option value="Tender">Tender — 10 weekdays</option>
          <option value="Submitted">Submitted</option>
        </select>
      </label>
      <label>Start date
        <input type="date" id="eStartDate" required>
      </label>
      <label>Last status comment
        <textarea id="eComment" rows="3" placeholder="Add a note about the current status..."></textarea>
      </label>
      <div class="modal-actions modal-actions-split">
        <button type="button" id="btnClearComment" class="btn btn-danger-ghost">Clear comment</button>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close="modalEdit">Cancel</button>
          <button type="submit" class="btn btn-primary">Save changes</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- ===================== HISTORY MODAL ===================== -->
<div id="modalHistory" class="modal-backdrop">
  <div class="modal modal-wide">
    <div class="modal-head">
      <h2 id="historyTitle">History</h2>
      <button class="modal-close" data-close="modalHistory">&times;</button>
    </div>
    <div id="historyBody" class="history-body"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
