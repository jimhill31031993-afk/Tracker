<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Site Control</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-mark">SC</div>
    <h1>Sign in</h1>
    <p class="auth-sub">Site Control — project timeline tracker</p>

    <div id="authError" class="auth-error" style="display:none;"></div>

    <form id="loginForm">
      <label>Email
        <input type="email" id="fEmail" required autocomplete="email">
      </label>
      <label>Password
        <input type="password" id="fPassword" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>

    <p class="auth-switch">No account yet? <a href="register.html">Register</a></p>
  </div>
</div>

<footer id="footerRoot" class="site-footer"></footer>

<script src="common.js"></script>
<script>
  document.getElementById("footerRoot").innerHTML = `<p>© Ravithra Alahakoon ${new Date().getFullYear()}</p>`;

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errEl = document.getElementById("authError");
    errEl.style.display = "none";
    try {
      await apiPost("/api/login", {
        email: document.getElementById("fEmail").value.trim(),
        password: document.getElementById("fPassword").value,
      });
      location.href = "index.html";
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = "block";
    }
  });
</script>
</body>
</html>
